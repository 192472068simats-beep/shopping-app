<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="product-container">
    <img src="/static/images/{{ product.image }}">
    <div class="info">
        <h2>{{ product.name }}</h2>
        <h3>₹{{ product.price }}</h3>
        <p>{{ product.description }}</p>
        <button class="btn">Add to Cart</button>
    </div>
</div>

</body>
</html>
